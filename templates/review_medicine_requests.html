{% extends 'layout.html' %}
{% block body %}
    <div class="text-center">
        <h1>Review medicine requests</h1>
        <p>requests for medicine from patients will appear here.</p>
    </div>
    
    {% for request in medicine_requests %}
        <button class="btn btn-link" type="button" data-toggle="collapse" data-target="#request{{ request['medicine_request_id'] }}" aria-expanded="false" aria-controls="request{{ request['medicine_request_id'] }}">
            thing
        </button>
        <div class="collapse" id="request{{ request['medicine_request_id'] }}">
            <div class="card">
                <div class="card-body">
                    <p>Medicine: {{ request['name'] }}</p>
                </div>
            </div>
        </div>
    {% endfor %}

{% endblock %}
