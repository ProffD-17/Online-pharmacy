{% extends 'layout.html' %}
{% block body %}

    <h1>Account: {{ account_info['username'] }}</h1>
    {% if action == 'view' %}
        <p>Username: {{ account_info['username'] }}</p>
        <p>Email: {{ account_info['email'] }}</p>
        <p>Status: {{ role }}</p>
        <form action="/account" method="get">
            <input type="hidden" name="action" value="edit">
            <button type="submit" class="btn btn-primary">Edit</button>
        </form>
    {% elif action == 'edit' %}
        <h2>Edit account info</h2>
        <form action="/account" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ account_info['username'] }}" required>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ account_info['email'] }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Change</button>
        </form>
    {% endif %}

{% endblock %}
