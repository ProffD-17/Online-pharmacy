{% extends 'layout.html' %}
{% block body %}

    <h1>Orders</h1>
    <h2>Uncompleted</h2>
    {% for order in uncompleted_orders %}
    <a class="underlined black-text" data-toggle="collapse" href="#order{{ loop.index }}" role="button" aria-expanded="false" aria-controls="{{ loop.index }}">
        {{ order['name'] }}
    </a>
    <div class="collapse" id="order{{ loop.index }}">
        <p>{{ order['name'] }}</p>
    </div>
    {% endfor %}
    <h2>Completed</h2>

{% endblock %}
