{% extends 'layout.html' %}
{% block body %}

    <h1>Create prescription</h1>
    <form action="/make_prescription" method="post" class="border">
        <div class="form-group">
            <label for="patient-firstname" class="form-label">Patient Firstname</label>
            <input type="text" class="form-control" id="patient-firstname" required name="patient_firstname">
        </div>
        <div class="form-group">
            <label for="patient-lastname" class="form-label">Patient Lastname</label>
            <input type="text" class="form-control" id="patient-lastname" required name="patient_lastname">
        </div>
        <div class="form-group"></div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" value="repeating" name="repeating" id="repeating">
                <label for="repeating" class="form-check-label">Repeating prescription</label>
            </div>
        
            <label for="repeating-start-date" class="form-label">Repeating start date (if repeating)</label>
            <input type="date" class="form-control" id="repeating-start-date" name="repeating_start_date">

            <label for="repeat-interval" class="form-label">Repeat interval (days)</label>
            <input type="number" class="form-control" min="0" name="repeat_interval">

            <label for="repeating-end-date" class="form-label">Repeating end date (if repeating)</label>
            <input type="date" class="form-control" id="repeating-end-date" name="repeating_end_date">
        </div>
        <div class="form-group">
            <label for="medicine_name" class="form-label">Medicine name</label>
            <select name="medicine_id" id="medicine-name">
                {% for medicine in medicines %}
                    <option value="{{ medicine['id'] }}">{{ medicine['generic_name'] }}</option>
                {% endfor %}
            </select>
        </div>

        <input type="hidden" name="creator_id" value="{{ user_id }}">

        <button type="submit" class="btn btn-primary">Create prescription</button>
    </form>

{% endblock %}
