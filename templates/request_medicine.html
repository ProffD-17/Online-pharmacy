{% extends 'layout.html' %}
{% block body %}
    <div class="text-center">
        <h1>Request medicine</h1>
        <p>Request a medicine from your doctor. Your doctor will handle the dose, cycle length <abbr title="excetera">ect.</abbr> if your request is aproved</p>
    </div>
    
    <form action="/request_medicine" method="post" class="m-3">
        <div class="form-group">
            <label for="medicine">Medicine:</label>
            <select name="medicine_id" id="medicine" class="form-control">
                <option selected value="">Select medicine</option>
                {% for medicine in medicines_info %}
                    <option value="{{ medicine['medicine_id'] }}">{{ medicine['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="request-reason">Request reason:</label>
            <textarea name="request_reason" id="request-reason" class="form-control" placeholder="e.g. Lower back pain when I reach above sholder height."></textarea>
        </div>
        <input type="hidden" value="{{ patient_id }}" name="patient_id">
        <button type="submit" class="btn btn-primary">Request medicine</button>
    </form>

{% endblock %}
